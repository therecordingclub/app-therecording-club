<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiny Room Gives — Summer Gala | Eventbrite Banner</title>
  <meta name="description" content="Tiny Room Gives Summer Gala event banner (2:1) — Friday, August 15, 2026, Secret Santa Monica Location. A benefit gala giving creatives the resources to succeed.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;0,600&display=swap" rel="stylesheet">
  <style>
    body{margin:0}
    .dl-bar{position:fixed;right:24px;bottom:24px;z-index:50;display:flex;gap:12px}
    .dl-btn{display:inline-block;text-decoration:none;font-family:'EB Garamond',Georgia,serif;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#EDECE3;background:#0B0B11;border:1px solid #0B0B11;padding:13px 22px 13px 20px;border-radius:3px;cursor:pointer;box-shadow:0 8px 24px rgba(11,11,17,.28);transition:transform .15s ease,background .15s ease}
    .dl-btn:hover{transform:translateY(-1px);background:#1a1a22}
    .dl-btn::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#F03222;margin-right:10px;vertical-align:middle}
    @media print{
      .no-print{display:none !important}
      body,.banner-ws{background:#fff !important}
      .banner-ws{min-height:0 !important;padding:0 !important;display:block !important}
      .banner-sheet{box-shadow:none !important}
    }
  </style>
</head>
<body>
<div class="banner-ws" style="min-height:100vh;background:#c9c7bc;display:flex;align-items:center;justify-content:center;padding:40px;font-family:'EB Garamond',Georgia,serif">

  <!-- 2160×1080 exported at 0.5 scale = 1080×540 on screen -->
  <div class="banner-sheet" style="position:relative;width:1080px;height:540px;background:#EDECE3;color:#0E0E10;overflow:hidden;box-shadow:0 30px 80px rgba(11,11,17,.4);display:flex;flex-direction:column">

    <!-- soft red glow -->
    <div style="position:absolute;top:-160px;right:-120px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(240,50,34,.16),rgba(240,50,34,0) 70%);pointer-events:none"></div>
    <div style="position:absolute;bottom:-200px;left:-140px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(240,50,34,.08),rgba(240,50,34,0) 70%);pointer-events:none"></div>

    <div style="position:relative;flex:1;display:flex;flex-direction:column;padding:56px 60px">

      <!-- top row: brand + tag -->
      <div style="display:flex;align-items:center;justify-content:space-between">
        <img src="assets/trg-logo.png" alt="Tiny Room Gives" style="height:52px;width:auto;display:block">
        <span style="font-family:'Cormorant Garamond',serif;font-weight:500;font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:#82817A">A Benefit Gala · 501(c)(3)</span>
      </div>

      <!-- center: title -->
      <div style="flex:1;display:flex;flex-direction:column;justify-content:center">
        <span style="font-family:'Cormorant Garamond',serif;font-weight:500;font-size:19px;letter-spacing:.3em;text-transform:uppercase;color:#82817A">Tiny Room Gives</span>
        <h1 style="font-family:'Cormorant Garamond',serif;font-weight:300;font-size:116px;line-height:.94;letter-spacing:.005em;margin:6px 0 0;color:#0E0E10">Summer <span style="color:#F03222">Gala</span></h1>
        <span style="font-family:'EB Garamond',serif;font-style:italic;font-size:22px;color:#45453F;margin-top:14px">A fundraiser giving creatives the resources to succeed</span>
        <div style="display:flex;align-items:center;gap:16px;margin-top:22px;font-family:'EB Garamond',serif;font-size:20px;letter-spacing:.04em;color:#45453F">
          <span>Curated dinner</span>
          <span style="display:block;width:6px;height:6px;border-radius:50%;background:#F03222"></span>
          <span>Live music</span>
          <span style="display:block;width:6px;height:6px;border-radius:50%;background:#F03222"></span>
          <span>Philanthropy</span>
        </div>
      </div>

      <!-- bottom: date bar -->
      <div style="display:flex;align-items:center;justify-content:space-between;gap:24px;border-top:1px solid rgba(14,14,16,.14);padding-top:24px">
        <span style="font-family:'Cormorant Garamond',serif;font-weight:500;font-size:19px;letter-spacing:.16em;text-transform:uppercase;color:#0E0E10;white-space:nowrap">Friday · August 15, 2026</span>
        <span style="font-family:'Cormorant Garamond',serif;font-weight:500;font-size:19px;letter-spacing:.16em;text-transform:uppercase;color:#0E0E10;white-space:nowrap">Secret Santa Monica Location</span>
      </div>

    </div>
  </div>
</div>

<div class="dl-bar no-print">
  <a class="dl-btn" href="Tiny-Room-Gives-Summer-Gala-Banner.png" download="Tiny-Room-Gives-Summer-Gala-Banner.png" aria-label="Download the banner as a 2160x1080 PNG">Download PNG</a>
  <a class="dl-btn" href="Tiny-Room-Gives-Summer-Gala-Banner.pdf" download="Tiny-Room-Gives-Summer-Gala-Banner.pdf" aria-label="Download the banner as a PDF">Download PDF</a>
</div>
</body>
</html>
